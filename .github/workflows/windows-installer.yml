name: Build and publish InvoiceFlow Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          architecture: 'x64'

      - name: Set up Node.js for interface checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Validate Python source
        run: python -m py_compile main.py web_app.py workspace_features.py

      - name: Run regression suite
        run: python -m pytest -q

      - name: Validate web interface JavaScript
        shell: pwsh
        run: |
          $html = Get-Content webui.html -Raw
          $match = [regex]::Match($html, '(?s)<script>(.*?)</script>')
          if (-not $match.Success) { throw 'Inline application script was not found.' }
          Set-Content -Path "$env:TEMP\invoiceflow-inline.js" -Value $match.Groups[1].Value -Encoding utf8
          node --check "$env:TEMP\invoiceflow-inline.js"

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: build_windows_installer.bat

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceFlow-Windows-Installer
          path: installer-output/InvoiceFlow_Setup_*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: InvoiceFlow ${{ github.ref_name }}
          generate_release_notes: true
          files: installer-output/InvoiceFlow_Setup_*.exe
